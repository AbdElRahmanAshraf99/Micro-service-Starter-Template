version: '3.8'

services:
  # Microservice
  microservice-starter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: microservice-starter
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - JAVA_OPTS=-Xms256m -Xmx512m
      - CONFIG_SERVER_USERNAME=config
      - CONFIG_SERVER_PASSWORD=config
      - ZIPKIN_BASE_URL=http://zipkin:9411
      - DB_URL=jdbc:mysql://mysql:3306/microservice_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - DB_USERNAME=root
      - DB_PASSWORD=root
      - DB_DRIVER=com.mysql.cj.jdbc.Driver
      - HIBERNATE_DIALECT=org.hibernate.dialect.MySQL5InnoDBDialect
    depends_on:
      - mysql
      - zipkin
    networks:
      - microservice-network
    restart: unless-stopped

  # MySQL Database
  mysql:
    image: mysql:5.7
    container_name: microservice-mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=microservice_db
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - microservice-network
    restart: unless-stopped

  # Zipkin for distributed tracing
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: microservice-zipkin
    ports:
      - "9411:9411"
    networks:
      - microservice-network
    restart: unless-stopped

  # Config Server (optional - uncomment if needed)
  # config-server:
  #   image: your-config-server-image:latest
  #   container_name: config-server
  #   ports:
  #     - "8888:8888"
  #   networks:
  #     - microservice-network
  #   restart: unless-stopped

networks:
  microservice-network:
    driver: bridge

volumes:
  mysql-data:
