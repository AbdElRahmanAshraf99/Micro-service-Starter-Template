server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /Microservice

spring:
  application:
    name: Microservice

  # Database Configuration
  datasource:
    url: ${DB_URL:jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:12345678}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    hikari:
      pool-name: HikariPool-MicroService
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000

  # JPA / Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        dialect: ${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}
        jdbc:
          time_zone: UTC

  # H2 Console (for development)
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:true}
      path: /h2-console

  # Jackson Configuration
  jackson:
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

  # MVC Configuration (needed for SpringFox 3.0 with Spring Boot 2.6+)
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

  # Zipkin / Sleuth Configuration
  sleuth:
    sampler:
      probability: ${SLEUTH_SAMPLER_PROBABILITY:1.0}
    propagation:
      type: B3
  zipkin:
    base-url: ${ZIPKIN_BASE_URL:http://localhost:9411}
    enabled: ${ZIPKIN_ENABLED:true}
    sender:
      type: web

# Feign Client Configuration
feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000
        loggerLevel: FULL
  circuitbreaker:
    enabled: false

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

# Logging Configuration
logging:
  level:
    root: INFO
    com.example.microservice: ${LOG_LEVEL:DEBUG}
    org.springframework.web: INFO
    org.hibernate.SQL: ${HIBERNATE_LOG_LEVEL:DEBUG}
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{traceId:-},%X{spanId:-}] %-5level %logger{36} - %msg%n"

# Swagger Configuration
swagger:
  enabled: ${SWAGGER_ENABLED:true}
  title: ${SWAGGER_TITLE:Microservice API}
  description: ${SWAGGER_DESCRIPTION:Microservice Starter Template API Documentation}
  version: ${SWAGGER_VERSION:1.0.0}
  contact:
    name: ${SWAGGER_CONTACT_NAME:API Support}
    email: ${SWAGGER_CONTACT_EMAIL:support@example.com}
  base-package: com.example.microservice.controller

# Application Info
info:
  app:
    name: ${spring.application.name}
    description: Microservice Starter Template
    version: 1.0.0
    encoding: UTF-8
    java:
      version: ${java.version}
